[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-router-lab"
version = "0.1.0"
description = "Relation-aware, calibrated and provenance-preserving context routing for interleaved agent conversations."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "context-router-lab contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "jieba>=0.42.1,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
ctxlab = "context_router.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Type-check at the development interpreter's version. The 3.11 runtime floor from
# requires-python is guarded by ruff's target-version, which rejects 3.12+ syntax;
# mypy cannot target 3.11 here because numpy's bundled stubs use PEP 695 `type`
# statements and abort the run before any of our own code is checked.
python_version = "3.13"
strict = true
packages = ["context_router"]

# jieba and scikit-learn ship no py.typed marker.
[[tool.mypy.overrides]]
module = ["jieba", "jieba.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

